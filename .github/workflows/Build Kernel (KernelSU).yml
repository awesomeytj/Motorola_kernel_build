name: Build Kernel (KernelSU)


on:
  workflow_dispatch:


jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup environment
        run: |
          echo "ANYKERNEL_SOURCE=$(cat config.env | grep -w "ANYKERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "ANYKERNEL_SOURCE_BRANCH=$(cat config.env | grep -w "ANYKERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "KERNEL_SOURCE=$(cat config.env | grep -w "KERNEL_SOURCE" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "KERNEL_SOURCE_BRANCH=$(cat config.env | grep -w "KERNEL_SOURCE_BRANCH" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "KERNEL_CONFIG=$(cat config.env | grep -w "KERNEL_CONFIG" | head -n 1 | cut -d "=" -f 2)" >> $GITHUB_ENV
          echo "BUILD_ARGS=$(cat config.env | grep -w "BUILD_ARGS" | head -n 1 | cut -d ":" -f 2)" >> $GITHUB_ENV
          sudo apt-get update
          sudo apt-get install -y libselinux-dev
          # The prebuilt Snapdragon-LLVM clang links against libtinfo.so.5 /
          # libncurses.so.5 (ncurses 5). The ubuntu-22.04+ runner image moved to
          # ncurses 6 and dropped libncurses5/libtinfo5 from its default repos, so
          # `clang -v` fails with "libtinfo.so.5: cannot open shared object file".
          # Fetch the .deb directly from the Ubuntu pool (name resolved at runtime
          # so it survives version bumps). python2 is NOT needed: gcc-wrapper.py
          # (its only consumer) is bypassed because BUILD_ARGS sets CC=clang.
          POOL="http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses"
          for pkg in libtinfo5 libncurses5; do
            deb=$(curl -sSL "$POOL/" | grep -oE "${pkg}_[^\"]*_amd64\.deb" | sort -V | tail -n1)
            echo "Fetching $deb"
            curl -sSLO "$POOL/$deb"
          done
          sudo dpkg -i libtinfo5_*_amd64.deb libncurses5_*_amd64.deb
      - name: Pull toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 arm-linux-androideabi-4.9
          git clone https://github.com/xiangfeidexiaohuo/Snapdragon-LLVM.git clang
          
      - name: Pull kernel source
        run: |
          git clone --depth=1 ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} kernel-source
          
      - name: KernelSU
        run: |
          cd kernel-source
          # Classic KernelSU (tiann). This is a 4.19 non-GKI kernel; both
          # KernelSU-Next v3.x and tiann v3.x unconditionally #include <linux/pgtable.h>,
          # which does not exist before kernel 5.8 -> build fails. v2.1.2 is the
          # last tiann release that compiles on 4.19 (no pgtable.h, version-gated).
          # Clone via git (not `curl raw... | bash`, which rate-limits to 429 and
          # feeds its error page to bash). setup.sh takes the tag as an argument.
          git clone https://github.com/tiann/KernelSU.git
          sh KernelSU/kernel/setup.sh v2.1.2
          # v2.1.2 emits MODULE_IMPORT_NS() unconditionally for kernels < 6.13,
          # but that macro only exists since kernel 5.4. On this 4.19 kernel the
          # bare macro fails to expand -> "parameter list without types" error.
          # Gate it so it is only emitted on kernels that actually have it (>=5.4).
          sed -i '/^#if LINUX_VERSION_CODE >= KERNEL_VERSION(6, 13, 0)$/,/^#endif$/{s/^#else$/#elif LINUX_VERSION_CODE >= KERNEL_VERSION(5, 4, 0)/}' KernelSU/kernel/ksu.c
          # put_task_struct() is declared in <linux/sched/task.h>, which
          # allowlist.c does not include -> implicit declaration on 4.19.
          sed -i '/#include <linux\/task_work.h>/a #include <linux/sched/task.h>' KernelSU/kernel/allowlist.c
          # TWA_RESUME (enum task_work_notify_mode) exists since 5.8; on 4.19 the
          # 3rd task_work_add() arg is a plain bool, so define it to true once in
          # the shared header instead of patching each of the 4 call sites.
          sed -i '/^#define __KSU_H_ALLOWLIST$/a \
\
#include <linux/version.h>\
#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 8, 0)\
#define TWA_RESUME true\
#endif' KernelSU/kernel/allowlist.h
          # struct seccomp gained filter_count in 5.9; skip it on older kernels.
          sed -i 's@^\([[:space:]]*\)atomic_set(&current->seccomp.filter_count, 0);@#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)\n\1atomic_set(\&current->seccomp.filter_count, 0);\n#endif@' KernelSU/kernel/app_profile.c
          cd ..

      - name: Add Droidspaces kernel config
        run: |
          cp "$GITHUB_WORKSPACE/droidspaces.config" kernel-source/arch/arm64/configs/droidspaces.config

      - name: Build kernel
        run: |
          export KBUILD_BUILD_USER="hiahia"
          export PATH=$GITHUB_WORKSPACE/clang/bin:${PATH}
          args="                  ARCH=arm64 \
                                  O=../out \
                                  ${{ env.BUILD_ARGS }} \
                                  CLANG_TRIPLE=aarch64-linux-gnu- \
                                  CROSS_COMPILE=$GITHUB_WORKSPACE/aarch64-linux-android-4.9/bin/aarch64-linux-android- \
                                  CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/arm-linux-androideabi-4.9/bin/arm-linux-androideabi- "
          cd kernel-source
          clang -v
          # Merge device defconfig + Droidspaces fragment; olddefconfig resolves deps.
          make ${args} ${{ env.KERNEL_CONFIG }} droidspaces.config
          # Enable KernelSU (setup.sh wired the Kconfig; enable the symbol).
          ./scripts/config --file ../out/.config --enable CONFIG_KSU
          make ${args} olddefconfig
          make -j$(nproc --all) ${args}

      - name: Package kernel
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_SOURCE }} -b ${{ env.ANYKERNEL_SOURCE_BRANCH }} AnyKernel3 && rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/LICENSE AnyKernel3/README.md
          if [[ -f out/arch/arm64/boot/Image.gz-dtb ]]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [[ -f out/arch/arm64/boot/Image-dtb ]]; then
            cp out/arch/arm64/boot/Image-dtb AnyKernel3/Image-dtb
          elif [[ -f out/arch/arm64/boot/Image.gz ]]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [[ -f out/arch/arm64/boot/Image ]]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi

      - name: Upload kernel to artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3_kernel
          path: AnyKernel3/*
